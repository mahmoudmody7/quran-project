<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduLang Studio - Ultimate</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Outfit:wght@400;700;900&display=swap');

        body { font-family: 'Cairo', sans-serif; background-color: #09090b; color: #f4f4f5; margin:0; overflow: hidden; height: 100dvh; display: flex; flex-direction: column; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }

        input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; background: #3f3f46; border-radius: 4px; outline: none; margin: 8px 0; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #3b82f6; cursor: pointer; box-shadow: 0 0 8px rgba(59, 130, 246, 0.6); }
        select, input[type="text"], textarea, input[type="color"] { width: 100%; padding: 10px; background: #18181b; border: 1px solid #27272a; border-radius: 6px; color: white; font-size: 12px; outline: none; transition: 0.2s; }
        select:focus, input:focus, textarea:focus { border-color: #3b82f6; }
        
        details { background: #18181b; border: 1px solid #27272a; border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
        summary { padding: 14px; font-size: 13px; font-weight: bold; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; color: #cbd5e1; user-select: none; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '\f078'; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: #52525b; transition: 0.3s; }
        details[open] summary::after { transform: rotate(180deg); color: #3b82f6; }
        details[open] summary { border-bottom: 1px solid #27272a; color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
        .details-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }

        .canvas-container { flex: 1; position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background-image: radial-gradient(#27272a 1px, transparent 1px); background-size: 15px 15px; background-color: #000; border-radius: 8px; overflow: hidden; min-width: 0; min-height: 0; }
        canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; box-shadow: 0 5px 20px rgba(0,0,0,0.8); }

        .panel-section { display: none; animation: fadeIn 0.3s ease; }
        .panel-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .tab-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; font-weight: bold; color: #a1a1aa; transition: 0.2s; cursor: pointer; flex: 1; padding: 10px 4px; border-bottom: 3px solid transparent; }
        .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.02); }
        .tab-btn.active { color: #3b82f6; border-bottom-color: #3b82f6; background: #18181b; }

        @media (min-width: 768px) { body { flex-direction: row; } .tab-btn { border-bottom: none; border-right: 3px solid transparent; padding: 15px 8px; } .tab-btn.active { border-right-color: #3b82f6; border-bottom-color: transparent; } }

        .file-btn { position: relative; overflow: hidden; text-align: center; cursor: pointer; font-size: 11px; font-weight: bold; padding: 12px; border-radius: 6px; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .file-btn input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }

        .dialogue-card { background: #09090b; border: 1px solid #3f3f46; border-radius: 8px; padding: 10px; margin-bottom: 10px; position: relative; transition: 0.3s; }
        .dialogue-card.active { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body>

    <main class="flex-none md:flex-1 h-[45vh] md:h-full flex flex-col relative bg-[#09090b] p-2 md:p-4 z-10 shadow-md border-b md:border-b-0 md:border-l border-[#27272a]">
        <div class="canvas-container mb-2 border border-[#27272a]" id="main-canvas-container">
            <canvas id="video-canvas"></canvas>
        </div>
        <div class="h-16 bg-[#18181b] rounded-lg border border-[#27272a] flex items-center justify-between px-3 shrink-0">
            <button onclick="changeDialogue(-1)" class="text-white bg-[#27272a] hover:bg-blue-600 px-3 py-2 rounded text-xs font-bold transition"><i class="fa-solid fa-chevron-right"></i> السابق</button>
            <div class="flex-1 px-4 text-center">
                <div class="flex justify-between text-[10px] text-zinc-400 mb-1"><span id="time-current">00:00</span><span id="time-total">00:00</span></div>
                <input type="range" id="progress-bar-audio" min="0" max="100" value="0" class="w-full !h-1.5 !m-0 !accent-blue-500" onchange="seekAudio(this.value)">
                <span id="preview-label" class="block text-[10px] text-blue-500 font-bold mt-1"></span>
            </div>
            <button onclick="changeDialogue(1)" class="text-white bg-[#27272a] hover:bg-blue-600 px-3 py-2 rounded text-xs font-bold transition">التالي <i class="fa-solid fa-chevron-left"></i></button>
            <button onclick="togglePlay()" id="play-btn" class="w-10 h-10 rounded-full bg-blue-500 hover:bg-blue-600 text-white flex items-center justify-center transition shadow-lg ml-2"><i class="fa-solid fa-play"></i></button>
        </div>
        <audio id="audio-player" class="hidden"></audio>
    </main>

    <aside class="flex-1 md:w-[450px] bg-[#111113] flex flex-col overflow-hidden relative">
        <div class="h-12 border-b border-[#27272a] flex items-center px-4 shrink-0 bg-[#18181b] shadow-sm z-10 justify-between">
            <h2 id="panel-title" class="font-bold text-sm text-white"><i class="fa-solid fa-list text-blue-500 ml-2"></i> السيناريو</h2>
        </div>

        <div class="flex-1 overflow-y-auto p-3 space-y-2 pb-20 md:pb-4 custom-scrollbar">
            
            <!-- تبويب الشخصيات -->
            <div id="tab-chars" class="panel-section space-y-3">
                <div class="bg-blue-900/10 p-3 rounded-lg border border-blue-900/30 text-[11px] text-blue-300 mb-3">
                    أضف شخصياتك، خصص صورة وأماكن كل شخصية، وموقع النص، والموجة الصوتية الخاصة بها.
                </div>
                <div id="speakers-container" class="space-y-3"></div>
                <button onclick="addSpeaker()" class="w-full bg-[#27272a] hover:bg-[#3f3f46] text-white font-bold py-3 rounded transition text-xs border border-dashed border-[#52525b]">
                    <i class="fa-solid fa-plus"></i> إضافة شخصية جديدة
                </button>
            </div>

            <!-- تبويب السيناريو -->
            <div id="tab-scenario" class="panel-section active space-y-3">
                <div class="bg-emerald-900/10 p-3 rounded-lg border border-emerald-900/30 mb-3 flex justify-between items-center">
                    <span class="text-xs text-emerald-300 font-bold">اكتب المحادثة واضبط التكرار والصمت</span>
                    <button onclick="addDialogueRow()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] px-3 py-1 rounded shadow">إضافة سطر</button>
                </div>

                <div id="dialogues-container" class="space-y-2"></div>

                <button onclick="generateAllAudio()" class="w-full mt-4 bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded transition text-sm shadow-lg shadow-blue-600/20">
                    <i class="fa-solid fa-microphone-lines"></i> <span id="btn-fetch-text">توليد كل الأصوات الناقصة</span>
                </button>
            </div>

            <!-- تبويب الخلفية والمشهد -->
            <div id="tab-bg" class="panel-section space-y-3">
                <div class="bg-[#18181b] p-3 rounded-lg border border-[#27272a]">
                    <h3 class="text-xs font-bold text-white mb-3"><i class="fa-solid fa-image text-blue-500 ml-1"></i> خلفية المشهد</h3>
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <div class="file-btn bg-[#27272a] hover:bg-[#3f3f46] text-zinc-200"><i class="fa-solid fa-image text-xl mb-1"></i> صورة<input type="file" accept="image/*" onchange="setBg('image', this)"></div>
                        <div class="file-btn bg-[#27272a] hover:bg-[#3f3f46] text-zinc-200"><i class="fa-solid fa-video text-xl mb-1"></i> فيديو<input type="file" accept="video/*" onchange="setBg('video', this)"></div>
                    </div>
                    <label class="flex justify-between text-[10px] text-zinc-300 mb-1"><span>تعتيم الخلفية (لإبراز النصوص)</span></label>
                    <input type="range" id="bg-opacity" min="0" max="100" value="40" oninput="updateSettings()">
                </div>

                <div class="bg-[#18181b] p-3 rounded-lg border border-[#27272a]">
                    <h3 class="text-xs font-bold text-white mb-3">أبعاد الفيديو</h3>
                    <select id="video-ratio" onchange="applyVideoSettings()" class="w-full bg-[#09090b]">
                        <option value="portrait">طولي - ريلز / تيك توك (9:16)</option>
                        <option value="landscape">عرضي - يوتيوب (16:9)</option>
                        <option value="square">مربع (1:1)</option>
                    </select>
                </div>
            </div>

            <!-- تبويب التصميم -->
            <div id="tab-design" class="panel-section space-y-2">
                <details open>
                    <summary><i class="fa-solid fa-font text-blue-500"></i> تصميم النصوص والألوان العامة</summary>
                    <div class="details-body">
                        <div class="grid grid-cols-2 gap-3 mb-2">
                            <div><label class="text-[10px] text-zinc-500 block">اللون الأساسي للإنجليزي</label><input type="color" id="en-color" value="#ffffff" oninput="updateSettings()" class="h-8 p-0 border-0 rounded w-full"></div>
                            <div><label class="text-[10px] text-zinc-500 block">لون التظليل للمتحدث</label><input type="color" id="en-highlight" value="#3b82f6" oninput="updateSettings()" class="h-8 p-0 border-0 rounded w-full"></div>
                        </div>
                        <label class="flex justify-between text-[10px] text-zinc-500 mb-1">حجم الخط الإنجليزي <span id="en-size-val">60</span></label>
                        <input type="range" id="en-size" min="20" max="120" value="60" oninput="updateSettings(); document.getElementById('en-size-val').innerText=this.value;">
                        
                        <hr class="border-[#3f3f46] my-2">
                        
                        <div class="grid grid-cols-2 gap-3 mb-2">
                            <div><label class="text-[10px] text-zinc-500 block">لون الترجمة العربية</label><input type="color" id="ar-color" value="#fbbf24" oninput="updateSettings()" class="h-8 p-0 border-0 rounded w-full"></div>
                        </div>
                        <label class="flex justify-between text-[10px] text-zinc-500 mb-1">حجم الخط العربي <span id="ar-size-val">40</span></label>
                        <input type="range" id="ar-size" min="20" max="100" value="40" oninput="updateSettings(); document.getElementById('ar-size-val').innerText=this.value;">
                    </div>
                </details>
            </div>

            <!-- تبويب التصدير -->
            <div id="tab-export" class="panel-section text-center p-2">
                <div class="bg-blue-900/20 p-5 rounded-xl border border-blue-900/30 mb-4">
                    <i class="fa-solid fa-clapperboard text-4xl text-blue-500 mb-3 block"></i>
                    <h3 class="text-white font-bold mb-2">إنتاج وتصدير الفيديو</h3>
                </div>
                
                <button id="btn-export" onclick="startExport()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-blue-600/30 text-sm">
                    <i class="fa-solid fa-rocket ml-1"></i> بدء التسجيل والتصدير
                </button>

                <div id="export-status" class="mt-4 hidden text-right bg-[#18181b] p-4 rounded-xl border border-[#27272a]">
                    <p id="status-msg" class="text-blue-400 text-xs font-bold mb-3 animate-pulse">جاري التحضير...</p>
                    <div class="w-full bg-[#09090b] h-3 rounded-full overflow-hidden border border-[#27272a]">
                        <div id="progress-bar-export" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
                    </div>
                </div>
                <a id="download-link" class="hidden mt-4 w-full block text-white font-bold py-4 rounded-xl transition text-sm text-center"></a>
            </div>

        </div>
    </aside>

    <nav class="w-full md:w-[80px] bg-[#09090b] border-t md:border-t-0 md:border-r border-[#27272a] flex md:flex-col overflow-x-auto shrink-0 z-20 absolute md:relative bottom-0 left-0 right-0">
        <button onclick="switchTab('scenario', 'السيناريو', this)" class="tab-btn active"><i class="fa-solid fa-list text-xl mb-1"></i>السيناريو</button>
        <button onclick="switchTab('chars', 'الشخصيات', this)" class="tab-btn"><i class="fa-solid fa-users text-xl mb-1"></i>الشخصيات</button>
        <button onclick="switchTab('bg', 'الخلفية والمشهد', this)" class="tab-btn"><i class="fa-solid fa-image text-xl mb-1"></i>الخلفية</button>
        <button onclick="switchTab('design', 'النصوص والتصميم', this)" class="tab-btn"><i class="fa-solid fa-font text-xl mb-1"></i>التصميم</button>
        <button onclick="switchTab('export', 'التصدير النهائي', this)" class="tab-btn text-emerald-500"><i class="fa-solid fa-clapperboard text-xl mb-1"></i>إنتاج</button>
    </nav>

    <script>
        // المتغيرات الأساسية
        let C_W = 1080; let C_H = 1920;
        const canvas = document.getElementById('video-canvas'); const ctx = canvas.getContext('2d');
        const offCanvas = document.createElement('canvas'); const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
        const audioPlayer = document.getElementById('audio-player');
        
        let state = {
            speakers: [], // { id, name, voice, imageObj, showImage, x, y, scale, textX, textY, vizOn, vizX, vizY, vizScale, vizColor }
            dialogues: [], // { id, speakerId, en, ar, baseAudioBuffer, repeat, pauseAfter, start, end }
            bg: { type: 'none', media: null },
            settings: {},
            audioCtx: null, analyser: null, dataArray: null,
            globalAudioBuffer: null,
            currentIndex: 0,
            isExporting: false,
            voicesList: ["alba", "marius", "javert", "jean", "fantine", "cosette", "eponine", "azelma", "Stella.wav", "Tyler.wav", "Juniper.wav"]
        };

        const val = id => document.getElementById(id).value;
        const num = id => parseFloat(document.getElementById(id).value) || 0;

        window.onload = () => {
            applyVideoSettings();
            addSpeaker(true); // Default speaker 1
            addSpeaker(true); // Default speaker 2
            addDialogueRow();
            requestAnimationFrame(renderLoop);
        };

        function switchTab(id, title, btn) {
            document.querySelectorAll('.panel-section').forEach(el => el.classList.remove('active')); document.getElementById(`tab-${id}`).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active')); btn.classList.add('active'); document.getElementById('panel-title').innerHTML = `<i class="fa-solid fa-check-circle text-blue-500 ml-2"></i> ${title}`;
        }

        function applyVideoSettings() {
            const ratio = document.getElementById('video-ratio').value;
            if (ratio === 'landscape') { C_W = 1920; C_H = 1080; } 
            else if (ratio === 'square') { C_W = 1080; C_H = 1080; } 
            else { C_W = 1080; C_H = 1920; }
            canvas.width = C_W; canvas.height = C_H; offCanvas.width = C_W; offCanvas.height = C_H;
            updateSettings();
        }

        function updateSettings() {
            state.settings = {
                bgOp: num('bg-opacity') / 100,
                enSize: num('en-size'), enColor: val('en-color'), enHighlight: val('en-highlight'),
                arSize: num('ar-size'), arColor: val('ar-color'),
            };
        }

        function setBg(type, input) {
            const file = input.files[0]; if(!file) return; const url = URL.createObjectURL(file);
            let mediaObj = type === 'video' ? document.createElement('video') : new Image();
            if(type === 'video') { mediaObj.muted = true; mediaObj.loop = true; mediaObj.playsInline = true; mediaObj.src = url; mediaObj.load(); mediaObj.play().catch(e=>{}); } 
            else { mediaObj.src = url; }
            state.bg = { type, media: mediaObj };
        }

        // -------- نظام الشخصيات والموجات المستقلة --------
        function generateId() { return Math.random().toString(36).substr(2, 9); }

        function addSpeaker(isDefault = false) {
            const id = generateId();
            const speakerNum = state.speakers.length + 1;
            const newSpeaker = {
                id: id, name: `Speaker ${speakerNum}`, voice: state.voicesList[(speakerNum-1) % state.voicesList.length],
                imageObj: null, showImage: true,
                x: isDefault && speakerNum === 1 ? 25 : (isDefault && speakerNum === 2 ? 75 : 50), y: 35, scale: 30,
                textX: isDefault && speakerNum === 1 ? 25 : (isDefault && speakerNum === 2 ? 75 : 50), textY: 65,
                vizOn: true, vizColor: '#3b82f6', vizScale: 100, 
                vizX: isDefault && speakerNum === 1 ? 25 : (isDefault && speakerNum === 2 ? 75 : 50), vizY: 85
            };
            state.speakers.push(newSpeaker);
            renderSpeakersUI(); updateDialogueSpeakersDropdowns();
        }

        function removeSpeaker(id) { state.speakers = state.speakers.filter(s => s.id !== id); renderSpeakersUI(); updateDialogueSpeakersDropdowns(); }

        function renderSpeakersUI() {
            const container = document.getElementById('speakers-container'); container.innerHTML = '';
            state.speakers.forEach(s => {
                const div = document.createElement('div');
                div.className = "bg-[#18181b] border border-[#27272a] p-3 rounded-lg relative mb-3";
                div.innerHTML = `
                    <button onclick="removeSpeaker('${s.id}')" class="absolute top-2 left-2 text-red-500 hover:text-red-400"><i class="fa-solid fa-trash"></i></button>
                    
                    <div class="flex gap-3 items-center mb-3">
                        <div class="file-btn bg-[#27272a] hover:bg-[#3f3f46] w-16 h-16 rounded flex-shrink-0 !p-0 flex items-center justify-center overflow-hidden border border-blue-500/50">
                            ${s.imageObj ? `<img src="${s.imageObj.src}" class="w-full h-full object-contain">` : `<i class="fa-solid fa-user text-xl"></i>`}
                            <input type="file" accept="image/*" onchange="uploadSpeakerImg('${s.id}', this)">
                        </div>
                        <div class="flex-1">
                            <input type="text" value="${s.name}" onchange="updateSpeakerProp('${s.id}', 'name', this.value)" placeholder="اسم الشخصية" class="mb-1 text-xs">
                            <select onchange="updateSpeakerProp('${s.id}', 'voice', this.value)" class="text-xs !p-1 mb-1">
                                ${state.voicesList.map(v => `<option value="${v}" ${v===s.voice?'selected':''}>صوت: ${v}</option>`).join('')}
                            </select>
                            <label class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer">
                                <input type="checkbox" ${s.showImage ? 'checked' : ''} onchange="updateSpeakerProp('${s.id}', 'showImage', this.checked)" class="w-3 h-3 accent-blue-500 rounded">
                                <span class="text-[10px] text-zinc-300">إظهار صورة الشخصية</span>
                            </label>
                        </div>
                    </div>
                    
                    <details class="mb-2 !bg-[#09090b]">
                        <summary class="!p-2 text-[10px]"><i class="fa-solid fa-arrows-up-down-left-right"></i> مكان الشخصية والنص</summary>
                        <div class="details-body !p-2 border-t border-[#27272a]">
                            <div class="grid grid-cols-3 gap-2 mb-2">
                                <div><label class="text-[9px] text-zinc-400 block">شخصية (X)</label><input type="range" min="0" max="100" value="${s.x}" oninput="updateSpeakerProp('${s.id}', 'x', this.value)"></div>
                                <div><label class="text-[9px] text-zinc-400 block">شخصية (Y)</label><input type="range" min="0" max="100" value="${s.y}" oninput="updateSpeakerProp('${s.id}', 'y', this.value)"></div>
                                <div><label class="text-[9px] text-zinc-400 block">حجم الصورة</label><input type="range" min="10" max="100" value="${s.scale}" oninput="updateSpeakerProp('${s.id}', 'scale', this.value)"></div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="text-[9px] text-emerald-400 block">مكان النص (X)</label><input type="range" min="0" max="100" value="${s.textX}" oninput="updateSpeakerProp('${s.id}', 'textX', this.value)"></div>
                                <div><label class="text-[9px] text-emerald-400 block">مكان النص (Y)</label><input type="range" min="0" max="100" value="${s.textY}" oninput="updateSpeakerProp('${s.id}', 'textY', this.value)"></div>
                            </div>
                        </div>
                    </details>

                    <details class="!bg-[#09090b] !m-0">
                        <summary class="!p-2 text-[10px]"><i class="fa-solid fa-wave-square"></i> إعدادات الموجة الصوتية</summary>
                        <div class="details-body !p-2 border-t border-[#27272a]">
                            <label class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer mb-2">
                                <input type="checkbox" ${s.vizOn ? 'checked' : ''} onchange="updateSpeakerProp('${s.id}', 'vizOn', this.checked)" class="w-3 h-3 accent-blue-500 rounded">
                                <span class="text-[10px] text-zinc-300">تفعيل الموجة لهذه الشخصية</span>
                            </label>
                            <div class="grid grid-cols-2 gap-2 mb-2">
                                <div><label class="text-[9px] text-zinc-400 block">لون الموجة</label><input type="color" value="${s.vizColor}" oninput="updateSpeakerProp('${s.id}', 'vizColor', this.value)" class="h-6 p-0 border-0 rounded w-full"></div>
                                <div><label class="text-[9px] text-zinc-400 block">حجم الموجة</label><input type="range" min="10" max="200" value="${s.vizScale}" oninput="updateSpeakerProp('${s.id}', 'vizScale', this.value)"></div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="text-[9px] text-zinc-400 block">موقع الموجة (X)</label><input type="range" min="0" max="100" value="${s.vizX}" oninput="updateSpeakerProp('${s.id}', 'vizX', this.value)"></div>

        // -------- حلقة الرسم (Render Loop) --------
        function renderLoop() {
            offCtx.clearRect(0, 0, C_W, C_H);
            let s = state.settings;
            let timeMs = state.isExporting ? (Date.now() - (window.exportStartTime || Date.now())) : (audioPlayer.currentTime * 1000);
            let isPlaying = !audioPlayer.paused || state.isExporting;

            // 1. رسم الخلفية
            if(state.bg.type !== 'none' && state.bg.media) { 
                if(state.bg.type === 'video' && state.bg.media.readyState >= 2) drawCover(offCtx, state.bg.media, state.bg.media.videoWidth, state.bg.media.videoHeight); 
                else if(state.bg.type === 'image') drawCover(offCtx, state.bg.media, state.bg.media.width, state.bg.media.height); 
            } else { let grad = offCtx.createLinearGradient(0,0,0,C_H); grad.addColorStop(0,"#1e3a8a"); grad.addColorStop(1,"#0f172a"); offCtx.fillStyle = grad; offCtx.fillRect(0,0,C_W,C_H); }
            offCtx.fillStyle = `rgba(0,0,0,${s.bgOp || 0.4})`; offCtx.fillRect(0,0,C_W,C_H);

            let activeDiag = null;
            if (state.globalAudioBuffer && state.dialogues.length > 0) {
                // Find strictly speaking time (excluding pauseAfter)
                activeDiag = state.dialogues.find(d => timeMs >= d.start && timeMs <= d.end);
            } 
            // إذا لم يكن هناك صوت يشتغل، اعرض المشهد المحدد في الواجهة (للتعديل والمعاينة)
            if (!activeDiag && !isPlaying && state.dialogues.length > 0) { activeDiag = state.dialogues[state.currentIndex]; }

            // 2. رسم الشخصيات
            state.speakers.forEach(speaker => {
                if(!speaker.showImage) return;

                let isSpeaking = activeDiag && activeDiag.speakerId === speaker.id && isPlaying;
                let sSize = C_W * (speaker.scale / 100);
                let xPos = C_W * (speaker.x / 100);
                let yPos = C_H * (speaker.y / 100);
                
                offCtx.save();
                if(isSpeaking) {
                    yPos += Math.sin(timeMs / 100) * 8; // Bounce
                    offCtx.shadowColor = s.enHighlight; offCtx.shadowBlur = 35;
                }
                
                // Opacity ثابت 100% لإزالة التعتيم
                offCtx.globalAlpha = 1.0; 

                if(speaker.imageObj) {
                    let ratio = speaker.imageObj.width / speaker.imageObj.height;
                    let drawW = sSize; let drawH = sSize / ratio;
                    offCtx.drawImage(speaker.imageObj, xPos - drawW/2, yPos - drawH/2, drawW, drawH);
                }
                offCtx.restore();

                // رسم الموجة الصوتية الخاصة بالشخصية
                if (speaker.vizOn && activeDiag && activeDiag.speakerId === speaker.id) {

                    let fakeMode = false;
                    if (isSpeaking && state.analyser) { drawViz = true; state.analyser.getByteFrequencyData(state.dataArray); }
                    else if (!isPlaying) { drawViz = true; fakeMode = true; } // موجة وهمية للمعاينة أثناء التوقف

                    if (drawViz) {
                        let count = 20; let startX = C_W * (speaker.vizX/100); let baseY = C_H * (speaker.vizY/100);
                        let barW = (C_W * (speaker.vizScale/100)) / count;

                        }

                    }
                }
            });

            // 3. رسم النصوص 
            if (activeDiag) {
                let activeSpeaker = state.speakers.find(sp => sp.id === activeDiag.speakerId);
                let tX = C_W * (activeSpeaker ? activeSpeaker.textX / 100 : 0.5);
                let tY = C_H * (activeSpeaker ? activeSpeaker.textY / 100 : 0.7);

                // نص إنجليزي (أو افتراضي)
                let textEn = activeDiag.en.trim() ? activeDiag.en : "Sample English Text";
                offCtx.font = `bold ${s.enSize}px 'Outfit', sans-serif`; 
                offCtx.textAlign = "center"; offCtx.textBaseline = "middle";
                offCtx.fillStyle = s.enColor;
                offCtx.shadowColor = "rgba(0,0,0,0.8)"; offCtx.shadowBlur = 10; offCtx.shadowOffsetY = 4;

                    // Handle repeat logic visually (show full text during repeat block)
                    if(progress > 1) progress = 1; if(progress < 0) progress = 0;
                    let words = textEn.split(' '); let wordsToShow = Math.ceil(progress * words.length);
                    textToDraw = words.slice(0, wordsToShow).join(' ');

                wrapTextLine(offCtx, textToDraw, tX, tY, C_W * 0.85, s.enSize * 1.3);

        }

                        msg.innerText = "✅ اكتمل التصدير بنجاح!"; bar.style.width = "100%"; ffmpeg.FS('unlink', 'in.webm'); ffmpeg.FS('unlink', 'out.mp4');
                    } catch (err) {
                        dLink.href = URL.createObjectURL(videoBlob); dLink.download = `EduLang_Pro_${Date.now()}.webm`; dLink.innerHTML = '<i class="fa-solid fa-download ml-1"></i> تحميل الفيديو (WebM)'; dLink.className = "mt-4 w-full block bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition text-sm text-center"; dLink.classList.remove('hidden'); bar.style.width = "100%"; msg.innerText = "اكتمل التصدير (صيغة بديلة)!";
                    } finally { btn.disabled = false; }
                };

                recorder.start(); let source = exportAudioCtx.createBufferSource(); source.buffer = state.globalAudioBuffer; 
                source.connect(state.analyser); state.analyser.connect(dest); source.connect(exportAudioCtx.destination); 
                window.exportStartTime = Date.now(); source.onended = () => { setTimeout(() => recorder.stop(), 500); }; source.start(0);

            } catch(e) { console.error(e); msg.innerText = "❌ حدث خطأ أثناء التحضير."; btn.disabled = false; state.isExporting = false; }
        }
